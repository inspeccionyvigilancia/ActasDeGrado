<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="./icono.png">
  <title>SIAG - Secretaría de Educación de Caldas</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="inst-header">
    <div class="inst-brand">
      <img src="./logo.png" alt="Logo Secretaría de Educación de Caldas">
      <div class="inst-titles">
        <h1>SECRETARIA DE EDUCACIÓN DE CALDAS</h1>
        <h2>GESTIÓN DE ACTAS DE GRADO</h2>
      </div>
    </div>
  </header>

  <main class="login-wrapper">
    <div class="login-card" id="loginBox">
      <h3>Iniciar Sesión - SIAG</h3>
      <div id="alertBox" class="alert hidden"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="usuario">Usuario (Nombre o Código DANE)</label>
          <input type="text" id="usuario" class="form-control" placeholder="Ej: ADMIN o 17001" required>
        </div>
        <div class="form-group">
          <label for="clave">Contraseña</label>
          <input type="password" id="clave" class="form-control" placeholder="Ingrese su clave" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">
          Ingresar al Sistema
        </button>
      </form>

      <button type="button" class="link-btn" id="btnShowReset">
        ¿Olvidó su contraseña? Restablecer vía correo electrónico
      </button>
    </div>

    <div class="login-card hidden" id="resetBox">
      <h3>Restablecer Contraseña</h3>
      <div id="resetAlert" class="alert hidden"></div>

      <form id="requestCodeForm">
        <div class="form-group">
          <label for="resetQuery">Usuario o Correo Electrónico Registrado</label>
          <input type="text" id="resetQuery" class="form-control" placeholder="Ej: ADMIN o correo@sedcaldas.edu.co" required>
        </div>
        <button type="submit" class="btn btn-warning" style="width: 100%;">
          Enviar Código de Verificación
        </button>
      </form>

      <form id="confirmResetForm" class="hidden" style="margin-top: 16px;">
        <input type="hidden" id="resetTargetUser">
        <div class="form-group">
          <label for="resetToken">Código de 6 dígitos enviado a su correo</label>
          <input type="text" id="resetToken" class="form-control" maxlength="6" required>
        </div>
        <div class="form-group">
          <label for="newPassword">Nueva Contraseña</label>
          <input type="password" id="newPassword" class="form-control" minlength="5" required>
        </div>
        <button type="submit" class="btn btn-success" style="width: 100%;">
          Guardar Nueva Contraseña
        </button>
      </form>

      <button type="button" class="link-btn" id="btnBackLogin">
        ← Volver al inicio de sesión
      </button>
    </div>
  </main>

  <div class="loader-overlay" id="loader">
    <div class="spinner"></div>
    <span>Procesando solicitud...</span>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
