<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Gestión de Actas</title>
    <script src="config.js"></script>
</head>
<body>
    <div id="header-container"></div>
    
    <div class="container" style="max-width: 400px; margin-top: 50px;">
        <div class="card" style="text-align: center;">
            <h3 style="color: #094062;">Inicio de Sesión</h3>
            <form id="loginForm">
                <input type="text" id="username" placeholder="Usuario (Nombre o CODDANE)" required style="width: 90%;"><br>
                <input type="password" id="password" placeholder="Contraseña" required style="width: 90%;"><br>
                <button type="submit" class="btn-green" style="width: 95%; margin-top: 15px;">INGRESAR</button>
            </form>
            <p id="errorMsg" style="color: red; display: none;"></p>
        </div>
    </div>

   <script>
        document.head.insertAdjacentHTML('beforeend', UI.getStyles());
        document.getElementById('header-container').innerHTML = UI.getHeader();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = "Verificando...";
            document.getElementById('errorMsg').style.display = 'none';
            
            try {
                const res = await apiCall({
                    action: 'login',
                    user: document.getElementById('username').value,
                    pass: document.getElementById('password').value
                });

                if (res.success) {
                    localStorage.setItem('user', res.user);
                    localStorage.setItem('role', res.role);
                    window.location.href = res.role === 'ADMINISTRADOR' ? 'admin.html' : 'operador.html';
                } else {
                    document.getElementById('errorMsg').innerText = res.message;
                    document.getElementById('errorMsg').style.display = 'block';
                    btn.innerText = "INGRESAR";
                }
            } catch (error) {
                document.getElementById('errorMsg').innerText = "Error de conexión con el servidor. Revisa tu URL de Apps Script.";
                document.getElementById('errorMsg').style.display = 'block';
                btn.innerText = "INGRESAR";
            }
        });
    </script>
</body>
</html>
